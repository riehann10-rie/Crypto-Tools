kind = "web"
previewPath = "/"
title = "Crypto Tools"
version = "1.0.0"
id = "artifacts/crypto-tools"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20252

[services.development]
run = "pnpm --filter @workspace/crypto-tools run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypto-tools", "run", "build" ]
publicDir = "artifacts/crypto-tools/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20252"
BASE_PATH = "/"
